name: Keychain shim spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keychain:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Run stdin-only keychain spike
        shell: bash
        run: |
          bun scripts/spike-keychain.ts > task5-verdict.json
          cat task5-verdict.json
      - name: Upload sanitized verdict
        uses: actions/upload-artifact@v4
        with:
          name: task5-${{ matrix.os }}
          path: task5-verdict.json
