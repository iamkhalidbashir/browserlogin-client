name: Keychain shim spike

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keychain:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Probe PowerShell stdin framing
        if: matrix.os == 'windows-2025'
        shell: bash
        run: |
          printf '%s\n' 'Write-Output framing-ok; [Console]::Error.WriteLine("stderr-ok")' | powershell.exe -NoProfile -NonInteractive -Command -
      - name: Run stdin-only keychain spike
        shell: bash
        run: |
          set +e
          bun scripts/spike-keychain.ts > task5-verdict.json
          status=$?
          set -e
          cat task5-verdict.json
          exit "$status"
      - name: Upload sanitized verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task5-${{ matrix.os }}
          path: task5-verdict.json
