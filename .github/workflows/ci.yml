name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.23"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  test:
    name: test-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Assert architecture
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            macos-arm64) test "$(uname -m)" = arm64 ;;
            linux-x64) test "$(uname -m)" = x86_64 ;;
            windows-x64) test "$PROCESSOR_ARCHITECTURE" = AMD64 ;;
          esac
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev build-essential cmake pkg-config xvfb
      - name: Install Hutch (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --channel production --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://hutch.blackboard.sh/hutch/install.ps1 | iex
          "$HOME/.hutch/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - run: hutch electrobun sync
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Run integration tests
        if: runner.os != 'Linux'
        run: bun run test:integration
      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:integration
      - run: bun run test:contract
      - name: Build unsigned desktop package
        run: |
          bun run build:web
          bun run build:runner-child
          bun scripts/electrobun.ts build
      - name: Verify desktop package inventory
        run: bun run check:package
      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          launcher="$(find build -type f -path '*/bin/launcher' -print -quit)"
          test -n "$launcher"
          if readelf --version-info "$launcher" | grep -Eq 'Name: GLIBC_([3-9]|2\.(3[6-9]|[4-9][0-9]))'; then
            echo "Linux package requires glibc newer than Ubuntu 22.04: $launcher" >&2
            exit 1
          fi
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Playwright E2E
        if: runner.os != 'Linux'
        run: bun run test:e2e
      - name: Playwright E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum bun run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: failure-${{ matrix.target }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  parity-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Hutch
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh -s -- --channel production --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
      - run: hutch electrobun sync
      - run: bunx vitest run tests/unit/fixtures.test.ts tests/integration/mocks.test.ts tests/contract

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun scripts/secrets-scan.ts
