name: Electrobun 2.x Spike Release

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run packaged early-exit smoke checks
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  BUN_VERSION: "1.2.23"
  HUTCH_CHANNEL: production

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
          - target: windows-x64
            runner: windows-2025
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Hutch (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/install-hutch.sh"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://hutch.blackboard.sh/hutch/install.sh --output "$installer"
          sh "$installer" --channel "$HUTCH_CHANNEL" --no-modify-path
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"

      - name: Install Hutch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = irm https://hutch.blackboard.sh/hutch/install.ps1
          & ([scriptblock]::Create($script)) -Channel $env:HUTCH_CHANNEL
          "$HOME\.hutch\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Assert native architecture (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          actual="$(uname -m)"
          if [[ "${{ matrix.target }}" == "macos-arm64" && "$actual" != "arm64" ]]; then
            echo "Expected arm64 on macos-14, got $actual" >&2
            exit 1
          fi
          if [[ "${{ matrix.target }}" == "linux-x64" && "$actual" != "x86_64" ]]; then
            echo "Expected x86_64 on ubuntu-24.04, got $actual" >&2
            exit 1
          fi
          printf 'target=%s runner=%s uname=%s\n' '${{ matrix.target }}' '${{ matrix.runner }}' "$actual"

      - name: Assert native architecture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne 'X64' -or $env:PROCESSOR_ARCHITECTURE -notmatch 'AMD64|x86') {
            throw "Expected x64 Windows runner, got OSArchitecture=$actual PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          }
          Write-Host "target=${{ matrix.target }} runner=${{ matrix.runner }} architecture=$actual PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config \
            xvfb

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Sync exact Electrobun devkit
        run: hutch electrobun sync

      - name: Build unsigned app
        run: hutch electrobun build --env=production

      - name: Validate artifact formats
        shell: bash
        run: |
          test -d artifacts
          find artifacts -maxdepth 1 -type f -print
          case '${{ matrix.target }}' in
            macos-arm64)
              compgen -G 'artifacts/*.dmg' >/dev/null || { echo 'missing .dmg'; exit 1; }
              compgen -G 'artifacts/*.app.tar.zst' >/dev/null || { echo 'missing .app.tar.zst'; exit 1; }
              ;;
            windows-x64)
              compgen -G 'artifacts/*Setup*.zip' >/dev/null || { echo 'missing setup .zip'; exit 1; }
              ;;
            linux-x64)
              compgen -G 'artifacts/*.tar.gz' >/dev/null || { echo 'missing .tar.gz'; exit 1; }
              compgen -G 'artifacts/*.tar.zst' >/dev/null || { echo 'missing .tar.zst'; exit 1; }
              ;;
          esac

      - name: Smoke packaged app (macOS)
        if: runner.os == 'macOS' && inputs.smoke
        shell: bash
        run: |
          app=$(find artifacts -maxdepth 1 -name '*.app' -type d | head -1)
          if [[ -z "$app" ]]; then
            app=$(find build -name '*.app' -type d | head -1)
          fi
          test -n "$app"
          binary="$app/Contents/MacOS/launcher"
          test -x "$binary"
          BROWSERLOGIN_SPIKE_SMOKE=1 "$binary"

      - name: Smoke packaged app (Linux)
        if: runner.os == 'Linux' && inputs.smoke
        shell: bash
        run: |
          binary=$(find build artifacts -type f -name 'BrowserLogin' -perm -111 | head -1 || true)
          if [[ -n "$binary" ]]; then
            BROWSERLOGIN_SPIKE_SMOKE=1 xvfb-run --auto-servernum "$binary"
          else
            echo 'Linux artifact is an archive; archive smoke is recorded as deferred to install verification.'
          fi

      - name: Smoke packaged app (Windows)
        if: runner.os == 'Windows' && inputs.smoke
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path build,artifacts -Recurse -Filter 'BrowserLogin.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $binary) {
            Write-Host 'Windows artifact is an installer archive; installer smoke is recorded as deferred.'
          } else {
            $env:BROWSERLOGIN_SPIKE_SMOKE = '1'
            & $binary.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload spike artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electrobun-spike-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
